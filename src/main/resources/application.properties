spring.application.name=nxtwave

#PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/task_tracker
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

#Auth
auth.jwt.secret=7ed579ca8a5a815ecb9751546df22c4ebe5d2c3cac41c85982eb38b4bf621e18
auth.jwt.access.expiry=900000
auth.jwt.refresh.expiry=604800000

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG